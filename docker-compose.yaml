services:
  main:
    build: .
    restart: unless-stopped
    volumes:
      - /mnt/spotify-dl:/mnt/spotify-dl
    env_file:
      - secrets.env
    environment:
      MONGODB_URI: mongodb://root:example@mongo:27017/
      DOWNLOADS_FOLDER: /mnt/spotify-dl
    depends_on:
      - mongo
  flask-ui:
    build: flask-ui
    restart: unless-stopped
    ports: 
      - 8000:8000
    env_file:
      - secrets.env
    environment:
      MONGODB_URI: mongodb://root:example@mongo:27017/
    depends_on:
      - mongo
  mongo:
    image: mongo
    restart: always
    volumes:
      - db-data:/data/db
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
volumes:
  db-data: